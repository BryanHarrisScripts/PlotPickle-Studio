<text x="49" y="418" font-size="24" font-weight="700" fill="#f5f1ff" text-anchor="start">The creative workflow</text><rect x="49" y="438" width="261" height="78" rx="12" fill="#242035" stroke="#51426b" stroke-width="1.5"/><text x="64" y="464" font-size="14" font-weight="700" fill="#c7a7ff" text-anchor="start">01</text><text x="64" y="487" font-size="17" font-weight="700" fill="#f5f1ff" text-anchor="start">Idea &amp; concept</text><text x="64" y="506" font-size="14" font-weight="400" fill="#c9c3d6" text-anchor="start">Find the story</text><rect x="329" y="438" width="261" height="78" rx="12" fill="#242035" stroke="#51426b" stroke-width="1.5"/><text x="344" y="464" font-size="14" font-weight="700" fill="#c7a7ff" text-anchor="start">02</text><text x="344" y="487" font-size="17" font-weight="700" fill="#f5f1ff" text-anchor="start">Script</text><text x="344" y="506" font-size="14" font-weight="400" fill="#c9c3d6" text-anchor="start">Shape the narrative</text><rect x="609" y="438" width="261" height="78" rx="12" fill="#242035" stroke="#51426b" stroke-width="1.5"/><text x="624" y="464" font-size="14" font-weight="700" fill="#c7a7ff" text-anchor="start">03</text><text x="624" y="487" font-size="17" font-weight="700" fill="#f5f1ff" text-anchor="start">Characters &amp; world</text><text x="624" y="506" font-size="14" font-weight="400" fill="#c9c3d6" text-anchor="start">Build continuity</text><rect x="889" y="438" width="261" height="78" rx="12" fill="#242035" stroke="#51426b" stroke-width="1.5"/><text x="904" y="464" font-size="14" font-weight="700" fill="#c7a7ff" text-anchor="start">04</text><text x="904" y="487" font-size="17" font-weight="700" fill="#f5f1ff" text-anchor="start">Storyboard</text><text x="904" y="506" font-size="14" font-weight="400" fill="#c9c3d6" text-anchor="start">Plan each shot</text><rect x="889" y="538" width="261" height="78" rx="12" fill="#242035" stroke="#51426b" stroke-width="1.5"/><text x="904" y="564" font-size="14" font-weight="700" fill="#c7a7ff" text-anchor="start">05</text><text x="904" y="587" font-size="17" font-weight="700" fill="#f5f1ff" text-anchor="start">Previsualization</text><text x="904" y="606" font-size="14" font-weight="400" fill="#c9c3d6" text-anchor="start">Explore the visuals</text><rect x="609" y="538" width="261" height="78" rx="12" fill="#242035" stroke="#51426b" stroke-width="1.5"/><text x="624" y="564" font-size="14" font-weight="700" fill="#c7a7ff" text-anchor="start">06</text><text x="624" y="587" font-size="17" font-weight="700" fill="#f5f1ff" text-anchor="start">Review &amp; approve</text><text x="624" y="606" font-size="14" font-weight="400" fill="#c9c3d6" text-anchor="start">Make the decisions</text><rect x="329" y="538" width="261" height="78" rx="12" fill="#242035" stroke="#51426b" stroke-width="1.5"/><text x="344" y="564" font-size="14" font-weight="700" fill="#c7a7ff" text-anchor="start">07</text><text x="344" y="587" font-size="17" font-weight="700" fill="#f5f1ff" text-anchor="start">Produce &amp; export</text><text x="344" y="606" font-size="14" font-weight="400" fill="#c9c3d6" text-anchor="start">Assemble the story</text><path d="M313 477 L325 477" stroke="#a88bea" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M593 477 L605 477" stroke="#a88bea" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M873 477 L885 477" stroke="#a88bea" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1019 518 L1019 533" stroke="#a88bea" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M885 577 L873 577" stroke="#a88bea" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M605 577 L593 577" stroke="#a88bea" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="49" y="538" width="261" height="78" rx="12" fill="#182820" stroke="#426e54" stroke-width="1.5"/><text x="179" y="570" font-size="19" font-weight="700" fill="#bbebca" text-anchor="middle">Your creative cut</text><text x="179" y="594" font-size="14" font-