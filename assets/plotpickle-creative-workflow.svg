<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">PlotPickle Studio — Learn. Experiment. Develop. Pitch.</title>
<desc id="desc">A storytelling learning and development workflow for students and hobbyists, with Elara as a collaborator, an expanding learning library, visual trial and error, and a pitch package for books, comics, short stories, feature films or episodic series.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181428"/><stop offset="1" stop-color="#10121d"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#b59aef"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1200" height="760" rx="24" fill="url(#bg)"/>
<rect x="24" y="24" width="1152" height="712" rx="18" fill="none" stroke="#393044"/>
<text x="52" y="77" font-size="36" font-weight="700" fill="#faf7ff">PlotPickle Studio</text>
<text x="1148" y="70" font-size="16" text-anchor="end" fill="#c5aaff">YOUR STORY. YOUR DECISIONS. YOUR CUT.</text>
<text x="52" y="120" font-size="23" fill="#e7dff6">A creative learning environment for students and hobbyists</text>
<rect x="52" y="144" width="1096" height="86" rx="12" fill="#251e35" stroke="#66518c"/>
<text x="76" y="180" font-size="23" font-weight="700" fill="#f4efff">You lead. Elara collaborates.</text>
<text x="76" y="208" font-size="18" fill="#d1c5e9">Your ideas, your creative decisions, your story. Learn by doing, with room to experiment.</text>
<rect x="52" y="276" width="262" height="174" rx="14" fill="#242035" stroke="#7760a5"/><text x="69" y="305" fill="#c5aaff" font-size="15" font-weight="700">01</text><text x="69" y="341" font-size="28" font-weight="700" fill="#f5f0ff">Learn</text><text x="69" y="373" font-size="18" font-weight="700" fill="#e2daf4">Storytelling craft</text><text x="69" y="402" font-size="14" fill="#d0c8db">Structure, character, dialogue</text><text x="69" y="425" font-size="14" fill="#d0c8db">An expanding learning library</text><rect x="330" y="276" width="262" height="174" rx="14" fill="#242035" stroke="#7760a5"/><text x="347" y="305" fill="#c5aaff" font-size="15" font-weight="700">02</text><text x="347" y="341" font-size="28" font-weight="700" fill="#f5f0ff">Experiment</text><text x="347" y="373" font-size="18" font-weight="700" fill="#e2daf4">Visual trial and error</text><text x="347" y="402" font-size="14" fill="#d0c8db">Explore scenes and alternatives</text><text x="347" y="425" font-size="14" fill="#d0c8db">Discover what works</text><rect x="608" y="276" width="262" height="174" rx="14" fill="#242035" stroke="#7760a5"/><text x="625" y="305" fill="#c5aaff" font-size="15" font-weight="700">03</text><text x="625" y="341" font-size="28" font-weight="700" fill="#f5f0ff">Develop</text><text x="625" y="373" font-size="18" font-weight="700" fill="#e2daf4">Build a better story</text><text x="625" y="402" font-size="14" fill="#d0c8db">Refine narrative and continuity</text><text x="625" y="425" font-size="14" fill="#d0c8db">Review, rethink and improve</text><rect x="886" y="276" width="262" height="174" rx="14" fill="#1c3030" stroke="#64b6b0"/><text x="903" y="305" fill="#c5aaff" font-size="15" font-weight="700">04</text><text x="903" y="341" font-size="28" font-weight="700" fill="#f5f0ff">Pitch</text><text x="903" y="373" font-size="18" font-weight="700" fill="#e2daf4">Communicate your vision</text><text x="903" y="402" font-size="14" fill="#d0c8db">Written, visual or cinematic</text><text x="903" y="425" font-size="14" fill="#d0c8db">A compelling pitch package</text>
<path d="M316 360H325 M594 360H603 M872 360H881" fill="none" stroke="#b59aef" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M728 456V479H183V456" fill="none" stroke="#b59aef" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="456" y="507" font-size="17" text-anchor="middle" fill="#d1c5e9">Try again • Learn from mistakes • Improve the story</text>
<text x="52" y="552" font-size="22" font-weight="700" fill="#f4efff">One creative process. Many storytelling formats.</text>
<rect x="52" y="573" width="208" height="55" rx="8" fill="#222333" stroke="#515671"/><text x="156" y="607" text-anchor="middle" font-size="17" fill="#e7e1f3" font-weight="600">Book</text><rect x="274" y="573" width="208" height="55" rx="8" fill="#222333" stroke="#515671"/><text x="378" y="607" text-anchor="middle" font-size="17" fill="#e7e1f3" font-weight="600">Comic book</text><rect x="496" y="573" width="208" height="55" rx="8" fill="#222333" stroke="#515671"/><text x="600" y="607" text-anchor="middle" font-size="17" fill="#e7e1f3" font-weight="600">Short story</text><rect x="718" y="573" width="208" height="55" rx="8" fill="#222333" stroke="#515671"/><text x="822" y="607" text-anchor="middle" font-size="17" fill="#e7e1f3" font-weight="600">Feature film</text><rect x="940" y="573" width="208" height="55" rx="8" fill="#222333" stroke="#515671"/><text x="1044" y="607" text-anchor="middle" font-size="17" fill="#e7e1f3" font-weight="600">Episodic series</text>
<text x="52" y="675" font-size="17" fill="#d0c8db">The goal is a better story and a compelling pitch — not a perfect finished film.</text>
<text x="1148" y="710" font-size="18" font-weight="700" fill="#c5aaff" text-anchor="end">The human remains the author.</text>
</g></svg>