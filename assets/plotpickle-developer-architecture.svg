<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">PlotPickle plugin — portable creative architecture</title>
<desc id="desc">Human-led learning and creative development, a portable creative core, host-specific integrations, optional capabilities, and a proposed governed feedback loop that improves the curriculum, Elara and technology through research and approved releases. Other hosts are untested.</desc>
