<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlotPickle Studio — fal Transfer Acceptance</title>
<style>
:root{color-scheme:dark;font:16px system-ui,Segoe UI,sans-serif}body{background:#111217;color:#f2f0fa;margin:0;padding:24px;max-width:700px}h1{font-size:20px;margin:0 0 10px}p{line-height:1.45;color:#d5d0df}button{background:#7f64c7;color:#fff;border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:default}#status{white-space:pre-wrap;background:#24232c;border-radius:9px;padding:12px;min-height:45px}small{color:#a7a1b1}</style></head>
<body><h1>PlotPickle Studio — Save fal Original</h1>
<p>Tests a source-verified MP4 transfer into ChatGPT Library without another storage provider. It does not change PlotPickle Save/Lock.</p>
<button id="save" disabled>Save original video to Library</button>
<p id="status" role="status" aria-live="polite">Waiting for source metadata…</p>
<small id="source"></small>
<script type="module">
const button=document.querySelector('#save');
const status=document.querySelector('#status');
const source=document.querySelector('#source');
const config=window.openai?.toolOutput ?? window.__plotpickleTestConfig ?? {};
const maxBytes=100*1024*1024;
const declaredBytes=Number(config.expectedBytes);
function report(message){status.textContent=message;}
function verifiedURL(raw){
  let u;
  try{u=new URL(raw)}catch{throw Error('Invalid source URL')}
  if(u.protocol!=='https:' || u.hostname!=='v3b.fal.media' || u.username || u.password || u.port || u.hash ||
     !/^\/files\/b\/[A-Za-z0-9_-]+\/[A-Za-z0-9_.-]+\.mp4$/.test(u.pathname))
    throw Error('Not a supported fal MP4 source');
  return u.href;
}
let url;
try{
  url=verifiedURL(config.url);
  if(!Number.isSafeInteger(declaredBytes)||declaredBytes<1||declaredBytes>maxBytes)throw Error('Invalid expected byte size');
  if(!window.openai || typeof window.openai.uploadFile!=='function')throw Error('ChatGPT Library upload helper unavailable in this host');
  source.textContent='Source: fal.ai original • '+declaredBytes.toLocaleString()+' expected bytes';
  report('Ready to test original file transfer. No generation is required.');button.disabled=false;
}catch(e){report('Not ready: '+e.message)}
button.addEventListener('click',async()=>{
  button.disabled=true;report('Downloading original fal media…');
  try{
    const r=await fetch(url,{method:'GET',mode:'cors',credentials:'omit',redirect:'error',signal:AbortSignal.timeout(7000)});
    if(!r.ok)throw Error('fal download HTTP '+r.status);
    const type=(r.headers.get('content-type')||'').split(';')[0].trim().toLowerCase();
    if(type!=='video/mp4')throw Error('Unexpected MIME type: '+type);
    const advertised=r.headers.get('content-length');
    if(advertised!==null&&Number(advertised)!==declaredBytes)throw Error('Declared source size mismatch');
    const blob=await r.blob();
    if(blob.size!==declaredBytes)throw Error('Downloaded original byte count mismatch: '+blob.size);
    const filename=(config.filename||'shot01-fal-original-1080p.mp4').replace(/[^A-Za-z0-9._-]/g,'_');
    report('Downloaded '+blob.size+' bytes. Calling ChatGPT Library upload…');
    const result=await window.openai.uploadFile(new File([blob],filename,{type:'video/mp4'}),{library:true});
    const id=result?.fileId;
    if(!id)throw Error('No file ID returned by ChatGPT');
    report('Upload reported by host. File ID: '+id+'\nPending independent Library readback and SHA-256 verification.');
    window.openai.setWidgetState?.({modelContent:'The fal original upload returned fileId '+id+'; independent Library readback remains required.',privateContent:{fileId:id,filename,sizeBytes:blob.size,sourceJob:config.requestId||null}});
  }catch(e){report('Transfer did not complete: '+e.message)}
  finally{button.disabled=false}
});
</script></body></html>
