name: PlotPickle fal MCP acceptance unit tests
on:
  pull_request:
    paths:
      - 'integrations/fal-library-mcp/**'
      - '.github/workflows/plotpickle-fal-mcp-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/fal-library-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked MCP dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify MCP tool, resource, and HTTP acceptance tests
        run: npm test
      - run: node --check server.mjs
      - run: node --check core.mjs
