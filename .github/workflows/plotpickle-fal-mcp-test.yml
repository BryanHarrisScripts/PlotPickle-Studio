name: PlotPickle fal MCP acceptance unit tests
on:
  pull_request:
    paths:
      - 'integrations/fal-library-mcp/**'
      - '.github/workflows/plotpickle-fal-mcp-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/fal-library-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned-compatible MCP dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Export resolved lockfile for pinning\n        run: |\n          echo 'PLOTPICKLE_PACKAGE_LOCK_START'\n          cat package-lock.json\n          echo 'PLOTPICKLE_PACKAGE_LOCK_END'\n      - name: Verify MCP tool, resource, and HTTP acceptance tests
        run: npm test
      - run: node --check server.mjs
      - run: node --check core.mjs
      - name: Retain resolved dependency lockfile for reproducible build
        uses: actions/upload-artifact@v4
        with:
          name: plotpickle-fal-mcp-dependency-lock
          path: integrations/fal-library-mcp/package-lock.json
          if-no-files-found: error
          retention-days: 7
