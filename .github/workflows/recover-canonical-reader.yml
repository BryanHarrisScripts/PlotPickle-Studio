name: Recover the exact published v0.8.33 canonical reader
on:
  push:
    branches:
      - recovery/reader-v0.8.34
permissions:
  contents: write
jobs:
  exact-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Studio recovery branch
        uses: actions/checkout@v4
        with:
          path: studio
          persist-credentials: true
      - name: Checkout pinned public legacy reader source
        uses: actions/checkout@v4
        with:
          repository: BryanHarrisScripts/PlotPickle
          ref: 7e3b5e5ece927c7eb39922d8f6355c266da43371
          path: legacy
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated compiler (no legacy app installation)
        run: |
          mkdir -p reader-toolchain
          npm install --prefix reader-toolchain --no-save --package-lock=false esbuild@0.25.12
          ln -s "$GITHUB_WORKSPACE/reader-toolchain/node_modules" legacy/node_modules
      - name: Bundle pinned canonical code without modifying original repository
        working-directory: legacy
        run: node tools/agent-plugins/plotpickle-story-reader/build.mjs
      - name: Require EXACT published reader SHA-256 before copying
        shell: bash
        run: |
          set -euo pipefail
          source="legacy/tools/agent-plugins/plotpickle-story-reader/skills/read-plotpickle-project/scripts/inspect-project.mjs"
          sha="$(sha256sum "$source" | cut -d ' ' -f 1)"
          echo "Built SHA-256: $sha"
          echo "Expected SHA-256: 6c9c239f4484d2cd624bfd1c761fa8645203cc8e78be1d58b11ec2500a5f498f"
          test "$sha" = "6c9c239f4484d2cd624bfd1c761fa8645203cc8e78be1d58b11ec2500a5f498f"
          test "$(wc -c < "$source")" -eq 1364997
          mkdir -p studio/skills/read-plotpickle-project/scripts
          cp "$source" studio/skills/read-plotpickle-project/scripts/inspect-project.mjs
      - name: Smoke-test the canonical reader with a newly created synthetic PPF
        shell: bash
        working-directory: studio
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reader-sample"
          printf '%s\n' '<FinalDraft><Content><Paragraph Type="Scene Heading"><Text>EXT. PIER - DAWN</Text></Paragraph><Paragraph Type="Action"><Text>A courier stops at the pier.</Text></Paragraph></Content></FinalDraft>' > "$RUNNER_TEMP/reader-sample/fixture.fdx"
          python skills/read-plotpickle-project/scripts/story-workflow.py import-fdx --file "$RUNNER_TEMP/reader-sample/fixture.fdx" --title 'Synthetic Reader Verification' --out "$RUNNER_TEMP/reader-sample/project"
          node skills/read-plotpickle-project/scripts/inspect-project.mjs --file "$RUNNER_TEMP/reader-sample/project/project.ppf.json" --operation identity > "$RUNNER_TEMP/reader-sample/identity.json"
          python -c 'import json,sys;p=json.load(open(sys.argv[1]));assert p["project"]["revision"] == 0 and not p["canonMutated"] and p["operation"]=="identity"' "$RUNNER_TEMP/reader-sample/identity.json"
      - name: Commit verified exact reader to Studio branch
        shell: bash
        working-directory: studio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/read-plotpickle-project/scripts/inspect-project.mjs
          if git diff --cached --quiet; then
            echo "Verified reader already tracked"; exit 0
          fi
          git commit -m "build(reader): restore sha256-pinned canonical v0.8.33 bundle"
          git push origin HEAD:refs/heads/recovery/reader-v0.8.34
