name: PlotPickle Studio private release staging tests
on:
  pull_request:
    paths:
      - scripts/stage_plugin_release.py
      - scripts/test_stage_plugin_release.py
      - .github/workflows/release-staging-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/stage_plugin_release.py
      - scripts/test_stage_plugin_release.py
      - .github/workflows/release-staging-tests.yml
permissions:
  contents: read
jobs:
  stage-synthetic:
    name: Fail-closed archive staging (synthetic only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise private-preservation, hash and path safety guards
        run: python -m unittest -v discover -s scripts -p 'test_stage_plugin_release.py'
      - name: Check release staging syntax
        run: python -m py_compile scripts/stage_plugin_release.py
