name: Verify exact published canonical reader
on:
  pull_request:
    paths:
      - skills/read-plotpickle-project/scripts/inspect-project.mjs
      - scripts/verify_reader.py
      - .github/workflows/verify-canonical-reader.yml
  push:
    branches:
      - recovery/reader-v0.8.34
permissions:
  contents: read
jobs:
  exact-reader:
    name: Exact SHA and canonical PPF tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify exact published inspector bytes
        run: python scripts/verify_reader.py
      - name: Test canonical source, editing and Save Lock integrity
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            test-workflow.py \
            test-project-model.py \
            test-default-save-lock.py \
            test-image-operations.py \
            test-story-change.py \
            test-storyboard-review.py; do
            python "skills/read-plotpickle-project/scripts/$suite"
          done
