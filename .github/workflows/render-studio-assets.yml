name: Render Studio-owned release assets
on:
  push:
    branches:
      - release/studio-v0.8.34
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deterministic vector renderer
        run: python -m pip install 'CairoSVG==2.8.2'
      - name: Render distinct Studio icons and verify manifests
        run: |
          python scripts/build_studio_branding.py
          python scripts/verify_source.py --phase release
      - name: Commit generated PNG assets to source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/studio-composer-icon.png assets/studio-logo.png
          if git diff --cached --quiet; then
            echo "Studio assets already up to date"
            exit 0
          fi
          git commit -m "build(branding): render Studio-owned plugin icon and wordmark"
          git push origin HEAD:refs/heads/release/studio-v0.8.34
