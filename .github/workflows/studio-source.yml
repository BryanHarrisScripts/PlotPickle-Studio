name: PlotPickle Studio source candidate
on:
  push:
    branches: [main, 'migration/**', 'maintenance/**']
  pull_request:
permissions:
  contents: read
jobs:
  source:
    name: Source-only checks (not a release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image decoder for verification tests
        run: python -m pip install Pillow
      - name: Check Studio source candidate
        run: python scripts/verify_source.py --phase source
      - name: Validate isolated synthetic editor seed
        working-directory: skills/plotpickle-editor/windows
        run: python -m unittest -v test_seed_fixture.py
      - name: Verify conversational story handoffs (synthetic source)
        run: python skills/plotpickle-story-flow/scripts/test-story-flow.py
      - name: Verify portable PPF archive recovery (synthetic files)
        run: python skills/plotpickle-story-flow/scripts/test-verify-portable-package.py
      - name: Test source-backed Storyboard Review (synthetic PPF)
        run: python skills/read-plotpickle-project/scripts/test-storyboard-review.py
      - name: Test Save then Lock and Unlock (synthetic PPF)
        run: python skills/read-plotpickle-project/scripts/test-default-save-lock.py
